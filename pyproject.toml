[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-doctor"
version = "1.0.0"
description = "Local-first Linux diagnostics and safe, explainable troubleshooting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
linux-doctor = "linux_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["linux_doctor*"]

[tool.setuptools.package-data]
linux_doctor = ["resources/*"]
